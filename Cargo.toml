[workspace]
members = [
    "crates/muiraquita-domain",
    "crates/muiraquita-adapters",
    "crates/muiraquita-ui",
    "crates/muiraquita-desktop",
    "crates/muiraquita-web",
    "crates/muiraquita-mobile",
]
resolver = "2"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
