[package]
name = "muiraquita-domain"
version = "0.1.0"
edition = "2024"
authors = ["Lumen <lumen@2lp.in>"]
description = "Core domain models for IndieWeb (IndieAuth, Microsub, Micropub) and IndieInABox extensions"
license = "GPL-3.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = { version = "2.5", features = ["serde"] }
sha2 = "0.10"
base64 = "0.22"
subtle = "2.6"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

[lints]
workspace = true
