[package]
name = "muiraquita-adapters"
version = "0.1.0"
edition = "2024"
authors = ["Lumen <lumen@2lp.in>"]
description = "I/O adapters (HTTP, XDG Storage, in-memory fakes) for Muiraquitã"
license = "GPL-3.0"

[dependencies]
muiraquita-domain = { path = "../muiraquita-domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
url = { version = "2.5", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["sync", "macros", "fs", "io-util"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[features]
default = ["tokio"]

[lints]
workspace = true
